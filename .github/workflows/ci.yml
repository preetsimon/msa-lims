name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: msa
          POSTGRES_PASSWORD: msa
          POSTGRES_DB: msa
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U msa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MSA_ENV: ci
      MSA_DATABASE_URL: postgresql+psycopg://msa_app:msa_app@localhost:5435/msa
      MSA_MIGRATION_DATABASE_URL: postgresql+psycopg://msa:msa@localhost:5435/msa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,pdf,oidc]"

      - name: Lint
        run: |
          ruff check src tests migrations
          ruff format --check src tests migrations

      - name: Typecheck
        run: mypy src

      # From empty, every time. A migration that only works against a database
      # someone already had is not a migration.
      - name: Migrate from empty
        run: alembic upgrade head

      # Proves the revisions are reversible, and catches a downgrade nobody
      # wrote. Then forward again so the tests have a schema.
      - name: Migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Test
        run: pytest -q -m "not fuzz"

      # Property-based fuzzing of the whole HTTP contract from the API's own
      # OpenAPI schema — a separate step so a crash it finds is attributable
      # at a glance, not buried in the main suite's output.
      - name: Fuzz the API contract
        run: pytest -q -m fuzz

      # No server needed — create_app().openapi() alone. The frontend job
      # downloads this to prove its committed generated types actually match
      # what the live app describes (idea #18, AUDIT_AND_BREAKTHROUGHS.md).
      - name: Export OpenAPI schema for the frontend's type-drift check
        run: python -m msa_lims.web.export_openapi frontend/openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    # Waits on the backend job for its exported openapi.json below — this
    # serializes what were two independent jobs, trading CI wall-clock time
    # for a drift check that is only meaningful against a schema the real
    # app actually produced, not a stale copy nobody re-exported.
    needs: backend
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: frontend

      # Regenerates generated-types.ts from the schema above and fails if
      # that differs from what's committed — a route or response-model
      # change that forgot `make generate-types` fails here, loudly.
      - name: Generated types match the live schema
        run: npm run check-types-drift

      - run: npm run lint
      - run: npm run build
